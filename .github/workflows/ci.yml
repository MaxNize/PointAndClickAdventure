# Pipeline: führt den Gate-Lauf `make ci` aus (EP-01), lokal und in der CI derselbe Befehl.
# Der Job heißt `ci-status`, damit EP-02 ihn als Pflicht-Check eintragen kann. Neue Prüfungen
# kommen in `tools/ci/run-ci.mjs` dazu, nicht als eigene Schritte hier.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Klon einrichten
        run: make setup
      - name: Gate-Lauf (EP-01)
        run: make ci
