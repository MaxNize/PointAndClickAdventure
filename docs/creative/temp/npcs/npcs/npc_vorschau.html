<title>NPCs – Nebenfiguren der Akademie</title>
<style>
:root{--gold:#e0ad4a;--cream:#f6ecd8}*{box-sizing:border-box}
html,body{margin:0;background:#140e10;color:var(--cream);font-family:Georgia,serif}
#app{max-width:1280px;margin:0 auto;padding:10px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 4px 10px}
h1{font-size:18px;margin:0;color:var(--gold)}.hint{flex:1;font-size:13px;opacity:.8;min-width:200px}
button{font:inherit;font-size:13px;color:var(--cream);background:#3b2620;border:1px solid #6b4836;border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--gold)}
#stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;box-shadow:0 6px 30px #000}
#stage svg{display:block;width:100%;height:100%;cursor:crosshair}
#bubble{position:absolute;max-width:320px;background:#1d1210ee;border:2px solid var(--gold);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.4;transform:translate(-50%,-100%);display:none;pointer-events:none}
#bubble b{color:var(--gold)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:12px}
.th{display:flex;flex-direction:column;align-items:center;padding:6px;background:#2a1a14;border-radius:10px}
.th.sel{border-color:var(--gold);box-shadow:0 0 10px #e0ad4a66}
.th img{height:150px}.th img.c{display:none}body.color .th img{display:none}body.color .th img.c{display:block}
.th span{color:var(--gold);font-size:13px}.th small{font-size:11px;opacity:.7}
#player{pointer-events:none}
.bub{animation:bub 1.6s infinite ease-in}.b2{animation-delay:.5s}.b3{animation-delay:1s}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
.flicker{animation:fl .35s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scaleY(1)}to{transform:scaleY(1.12) scaleX(.94)}}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

,102 186,96 200,96.5 C215,96.8 230,104 239,114 C243.5,119 245.5,124 245.5,130 L245.5,143 C245.5,146.5 243.7,148 243.7,150.5 C245.7,154.5 252.5,157.5 255.5,160 L254.9,162.2 C253.0,165 253.2,166 251.2,167 C251.2,169 252,169 252,172 L249.4,174.8 C251.0,175.8 251.1,176.20000000000002 251.1,178.20000000000002 C251.1,180.20000000000002 247.4,180.70000000000002 246.4,182.70000000000002 C246.4,184.70000000000002 248,188 248,191 C248,194 246,196 242,196 L212,196.3 C207,196 204,193 201.5,188 C200,185 199,183 197.5,182 C190,184 176,178 168,166 C162,158 162,150 162,140 Z\"/>\n    <path class=\"nhair\" d=\"M152,124 C150,100 176,90 208,92 C236,94 254,108 256,134 Q240,124 222,124 L216,134 C212,150 210,168 210,186 L206,204 L194,198 L184,206 L174,198 L162,204 C150,176 148,146 152,124 Z\"/>\n    <path class=\"skin\" d=\"M199.5,181 C195,183.5 189,180.5 186,176 C183,171 182.2,165 182.6,161 C183.2,157 185.5,154.4 188,154.2 C190.6,154 192.6,155.6 193.6,157.8 C195.5,162 197.5,168 199,173 Z\"/>\n    <path class=\"line\" d=\"M187.5,159.5 Q185.2,166.5 189.5,173.5\"/>\n    <ellipse class=\"niris\" cx=\"232\" cy=\"154\" rx=\"2.6\" ry=\"4.6\"/><circle class=\"hl\" cx=\"232.6\" cy=\"152\" r=\"1\"/>\n    <path class=\"lash\" d=\"M237,149.5 Q230,147 225,151\" style=\"stroke-width:1.8\"/>\n    <path class=\"nbrow\" d=\"M226,141 Q234,137.5 243,139\"/>\n    \n    <path class=\"mouthline\" d=\"M250.0,174.8 Q247.0,175.60000000000002 244.4,175.0\"/>\n    \n  </g>\n</g><g id=\"characterBack\" style=\"display:none\" transform=\"translate(200 773) scale(1.0) translate(-200 -773)\">\n  <ellipse class=\"groundshadow\" cx=\"200\" cy=\"773\" rx=\"60\" ry=\"7\"/>\n  <g id=\"back_leg_l\"><path class=\"nlow\" d=\"M169,350 C166,450 170,620 173,730 L194,730 C196,620 196,450 195,350 Z\"/><path class=\"nshoe\" d=\"M168.0,722 L196.0,722 L197.0,760 Q197.0,773 186.0,773 L171.0,773 Q163.0,771 166.0,760 Z\"/></g><g id=\"back_leg_r\"><path class=\"nlow\" d=\"M231,350 C234,450 230,620 227,730 L206,730 C204,620 204,450 205,350 Z\"/><path class=\"nshoe\" d=\"M232,722 L204,722 L203,760 Q203,773 214,773 L229,773 Q237,771 234,760 Z\"/></g>\n  <path class=\"ntop\" d=\"M170,222 Q200,212 230,222 C234,270 228,306 224,342 L176,342 C172,306 166,270 170,222 Z\"/>\n  <path class=\"nskirt\" d=\"M174,330 L226,330 C235.0,445.0 246,530 246,560 Q200,568 154,560 C154,530 165.0,445.0 174,330 Z\"/>\n  <path class=\"nbelt\" d=\"M174,326 L226,326 L226,336 L174,336 Z\"/>\n  \n  \n  <g id=\"back_arm_l\"><g transform=\"rotate(6 168 230)\"><path class=\"ntop\" d=\"M176,224 C156,228 150,252 150,282 L146,360 L168,363 L172,286 C174,262 178,244 182,236 Z\"/><ellipse class=\"skin\" cx=\"157\" cy=\"374\" rx=\"9\" ry=\"11\"/></g></g><g id=\"back_arm_r\"><g transform=\"rotate(-6 232 230)\"><g transform=\"translate(400 0) scale(-1 1)\"><path class=\"ntop\" d=\"M176,224 C156,228 150,252 150,282 L146,360 L168,363 L172,286 C174,262 178,244 182,236 Z\"/><ellipse class=\"skin\" cx=\"157\" cy=\"374\" rx=\"9\" ry=\"11\"/><rect class=\"nprop\" x=\"152\" y=\"368\" width=\"10\" height=\"34\" rx=\"4\"/><rect class=\"npropdk\" x=\"150\" y=\"366\" width=\"14\" height=\"5\" rx=\"2\"/><rect class=\"npropdk\" x=\"150\" y=\"399\" width=\"14\" height=\"5\" rx=\"2\"/></g></g></g>\n  <g id=\"back_head\">\n    <rect class=\"skin\" x=\"192\" y=\"182\" width=\"16\" height=\"40\"/>\n    <circle class=\"skin\" cx=\"152\" cy=\"156\" r=\"6.5\"/><circle class=\"skin\" cx=\"248\" cy=\"156\" r=\"6.5\"/>\n    <path class=\"skin\" d=\"M156,130 C156,104 178,92 200,92 C222,92 244,104 244,130 L244,176 C232,194 168,194 156,176 Z\"/>\n    <path class=\"nhair\" d=\"M146,116 C138,150 140,186 148,206 L162,198 L176,208 L190,200 L200,210 L210,200 L224,208 L238,198 L252,206 C260,186 262,150 254,116 C256,94 230,80 200,80 C170,80 144,94 146,116 Z\"/>\n    \n  </g>\n</g>"}};
function svgPoint(e){ const p = svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
/* ---------- Laufen ----------
   Posen: 'idle' (Frontansicht steht), 'side' (seitlich, nach links gespiegelt),
   'front' (läuft nach vorn/unten), 'back' (läuft nach hinten/oben).
   Der Boden reicht von FLOOR_MIN (hinten) bis FLOOR_MAX (vorn); hinten wird die Figur kleiner. */
const FLOOR_MIN = 645, FLOOR_MAX = 705, DEPTH = 2.2;   // DEPTH: Tiefe ist gestaucht -> langsamer in y
let walkCb=null, target=null, last=0, phase=0, running=false;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function depthScale(y){ return 0.44 + (y-FLOOR_MIN)/(FLOOR_MAX-FLOOR_MIN)*0.08; }
function setPlayer(){
  const sc = depthScale(S.y), sx = S.pose==='side' ? sc*S.dir : sc;
  $('#player').setAttribute('transform',`translate(${S.x.toFixed(1)},${S.y.toFixed(1)})`);
  $('#flip').setAttribute('transform',`scale(${sx.toFixed(4)},${sc.toFixed(4)})`);
}
function setPose(p){
  if(p===true) p='side'; if(p===false) p='idle';
  S.pose = p; S.walking = p!=='idle';
  $('#character').style.display = (p==='idle'||p==='front') ? '' : 'none';
  $('#characterSide').style.display = p==='side' ? '' : 'none';
  $('#characterBack').style.display = p==='back' ? '' : 'none';
  resetJoints();
  if(p==='idle'){ phase = 0; $('#bob').removeAttribute('transform'); }
  setPlayer();
}
const rot = (sel,deg,cx,cy) => $(sel).setAttribute('transform',`rotate(${deg.toFixed(2)} ${cx} ${cy})`);
const lift = (sel,dy) => $(sel).setAttribute('transform',`translate(0 ${dy.toFixed(2)})`);
/* Laufstil je Figur: Standardwerte = Gang der Alchemistin; eine Seite kann window.WALK_STYLE vorher setzen. */
const WALK = Object.assign({hip:20, knee:44, arm:16, fore:16, lean:3, swag:0, lift:13, bob:6, sway:1.6, armOut:4, speed:330}, window.WALK_STYLE || {});
const LEG_T = 198, LEG_S = 223, LEG = LEG_T + LEG_S, HIP_A = WALK.hip;   // Ober-/Unterschenkel (lokale Einheiten), Hüftausschlag
const STRIDE_PER_RAD = 2*LEG*Math.sin(HIP_A*Math.PI/180)/Math.PI;    // Weg pro Phasen-Radiant -> Füße rutschen nicht
function animateSide(ph){
  /* Seitlicher Gang: Hüfte schwingt, das Schwungbein beugt das Knie früh nach dem Abdrücken.
     Die Körperhöhe wird aus der Beinstellung berechnet, so dass das Standbein immer den Boden berührt. */
  let ground = Infinity;
  [['#side_leg_near', ph], ['#side_leg_far', ph + Math.PI]].forEach(([sel,p])=>{
    const hip = -HIP_A*Math.sin(p);
    const swing = Math.max(0, Math.cos(p + 0.6));
    const knee = 4 + WALK.knee*Math.pow(swing, 1.4);
    rot(sel, hip, 205, 352); rot(sel+'_shin', knee, 206, 550);
    const h = hip*Math.PI/180, k = (hip + knee)*Math.PI/180;
    ground = Math.min(ground, LEG - (LEG_T*Math.cos(h) + LEG_S*Math.cos(k)));   // wie weit der Fuß über dem Boden schwebt
  });
  [['#side_arm_near', ph + Math.PI], ['#side_arm_far', ph]].forEach(([sel,p])=>{
    rot(sel, -WALK.arm*Math.sin(p), 205, 232); rot(sel+'_fore', -12 - WALK.fore*Math.max(0, Math.sin(p)), 204, 288);
  });
  const lean = WALK.lean + WALK.swag*Math.sin(2*ph);
  $('#bob').setAttribute('transform', `translate(0 ${ground.toFixed(2)}) rotate(${lean.toFixed(2)} 205 770)`);
}
function animateStraight(ph, legs, arms){
  /* Laufen auf die Kamera zu oder weg: Beine heben sich weich abwechselnd,
     der Körper ist am höchsten, wenn ein Bein durchschwingt, und pendelt leicht. */
  const a = Math.sin(ph), sl = Math.max(0, a), sr = Math.max(0, -a);
  const hl = -WALK.lift*sl*sl*(3-2*sl), hr = -WALK.lift*sr*sr*(3-2*sr);
  legs[0].forEach(sel => lift(sel, hl)); legs[1].forEach(sel => lift(sel, hr));
  if(arms){
    // Von hinten schwingen die Arme vor/zurück: leichte Verkürzung, Pendeln nur nach außen, nie über den Körper.
    const sw = (sel, out, cx, k) => $(sel).setAttribute('transform',
      `rotate(${out.toFixed(2)} ${cx} 230) translate(${cx} 230) scale(1 ${k.toFixed(3)}) translate(${-cx} -230)`);
    sw(arms[0],  WALK.armOut*sl, 168, 1 - 0.09*sr);
    sw(arms[1], -WALK.armOut*sr, 232, 1 - 0.09*sl);
  }
  const bob = -Math.abs(a)*WALK.bob, sway = WALK.sway*a;
  $('#bob').setAttribute('transform', `translate(0 ${bob.toFixed(2)}) rotate(${sway.toFixed(2)} 200 770)`);
}
function animateWalk(ph){
  if(S.pose==='side') animateSide(ph);
  else if(S.pose==='front') animateStraight(ph, [['#front_leg_l','#boot_l'],['#front_leg_r','#boot_r']]);
  else if(S.pose==='back') animateStraight(ph, [['#back_leg_l'],['#back_leg_r']], ['#back_arm_l','#back_arm_r']);   // Stiefel + Absatz stecken in der Beingruppe
}
function animateJoints(ph){ animateSide(ph); }   // Kompatibilität (Tests)
function resetJoints(){
  ['#side_leg_near','#side_leg_far','#side_arm_near','#side_arm_far','#side_leg_near_shin','#side_leg_far_shin',
   '#side_arm_near_fore','#side_arm_far_fore','#front_leg_l','#front_leg_r','#boot_l','#boot_r',
   '#back_leg_l','#back_leg_r','#back_boot_l','#back_boot_r','#back_arm_l','#back_arm_r']
    .forEach(s=>{ const el=$(s); if(el) el.removeAttribute('transform'); });
}
function face(){ /* Frontansicht bleibt im Stand immer ungespiegelt */ }
function choosePose(dx, dy){
  const p = Math.abs(dy)*DEPTH > Math.abs(dx) ? (dy < 0 ? 'back' : 'front') : 'side';
  if(Math.abs(dx) > 0.5) S.dir = dx > 0 ? 1 : -1;
  if(p !== S.pose) setPose(p); else setPlayer();
}
function walkTo(x, cb, y){
  target = {x: clamp(x, 60, 1220), y: (y===undefined || y===null) ? S.y : clamp(y, FLOOR_MIN, FLOOR_MAX)};
  walkCb = cb || null;
  const dx = target.x - S.x, dy = target.y - S.y;
  if(Math.hypot(dx, dy*DEPTH) < 3){ target=null; setPose('idle'); const c=walkCb; walkCb=null; c&&c(); return; }
  choosePose(dx, dy);
  if(!running){ running = true; last = 0; requestAnimationFrame(step); }
}
function step(ts){
  if(!target){ running=false; return; }
  const dt = last ? Math.min(.05,(ts-last)/1000) : 0; last = ts;
  const dx = target.x - S.x, dy = target.y - S.y;
  const dist = Math.hypot(dx, dy*DEPTH), mv = WALK.speed*dt;
  if(dist <= mv){
    S.x = target.x; S.y = target.y; target = null; running = false; setPose('idle');
    const c = walkCb; walkCb = null; c && c(); return;
  }
  S.x += dx/dist*mv; S.y += dy/dist*mv;
  phase += mv/(STRIDE_PER_RAD*depthScale(S.y));
  animateWalk(phase); setPlayer(); requestAnimationFrame(step);
}


const BASE = Object.assign({}, WALK);
let current = null, lineIdx = 0, bubbleTimer;
function select(id){
  target = null; running = false;
  current = id; lineIdx = 0;
  $('#npcRoot').innerHTML = NPC[id].markup;
  $('#player').setAttribute('class', 'npc-' + id);
  Object.assign(WALK, BASE, NPC[id].walk);
  document.querySelectorAll('.th').forEach(b => b.classList.toggle('sel', b.dataset.id === id));
  setPose('idle'); hideBubble();
}
function hideBubble(){ $('#bubble').style.display='none'; }
function talk(){
  const n = NPC[current], line = n.lines[lineIdx++ % n.lines.length];
  const r = $('#player').getBoundingClientRect(), st = $('#stage').getBoundingClientRect();
  const b = $('#bubble'); b.innerHTML = `<b>${n.name}</b> <small>(${n.role})</small><br>${line}`;
  b.style.left = (r.left + r.width/2 - st.left) + 'px'; b.style.top = (r.top - st.top - 6) + 'px'; b.style.display = 'block';
  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(hideBubble, 3800);
}
svg.addEventListener('click', e => { tour = null; hideBubble(); const p = svgPoint(e); walkTo(p.x, null, p.y >= 600 ? p.y : null); });
document.querySelectorAll('.th').forEach(b => b.onclick = () => select(b.dataset.id));
$('#btnTalk').onclick = talk;
let tour = null;
const ROUTE = [[1000,690],[1000,648],[300,648],[300,702],[640,690]];
function runTour(i=0){ if(tour===null) return; if(i>=ROUTE.length){ tour=null; talk(); return; } walkTo(ROUTE[i][0], ()=>setTimeout(()=>runTour(i+1),300), ROUTE[i][1]); }
$('#btnTour').onclick = () => { hideBubble(); tour = 1; runTour(0); };
$('#btnStyle').onclick = () => {
  const c = document.body.classList.toggle('color'); document.body.classList.toggle('dark', !c); document.body.classList.toggle('nolines', !c);
  $('#btnStyle').textContent = c ? 'Scherenschnitt ansehen' : 'Farbversion ansehen';
};
select('lena');
setTimeout(talk, 500);
</script></body></html>
