<script>
const $ = s => document.querySelector(s);
const svg = $('#svg');
const S = {x:640, y:690, dir:1, pose:'idle', walking:false};
window.WALK_STYLE = {"hip": 12, "knee": 26, "arm": 5, "fore": 4, "lean": 6, "swag": 0.6, "lift": 7, "bob": 2.5, "sway": 1.2, "armOut": 2, "speed": 190};
function svgPoint(e){ const p = svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
/* ---------- Laufen ----------
   Posen: 'idle' (Frontansicht steht), 'side' (seitlich, nach links gespiegelt),
   'front' (läuft nach vorn/unten), 'back' (läuft nach hinten/oben).
   Der Boden reicht von FLOOR_MIN (hinten) bis FLOOR_MAX (vorn); hinten wird die Figur kleiner. */
const FLOOR_MIN = 645, FLOOR_MAX = 705, DEPTH = 2.2;   // DEPTH: Tiefe ist gestaucht -> langsamer in y
let walkCb=null, target=null, last=0, phase=0, running=false;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function depthScale(y){ return 0.44 + (y-FLOOR_MIN)/(FLOOR_MAX-FLOOR_MIN)*0.08; }
function setPlayer(){
  const sc = depthScale(S.y), sx = S.pose==='side' ? sc*S.dir : sc;
  $('#player').setAttribute('transform',`translate(${S.x.toFixed(1)},${S.y.toFixed(1)})`);
  $('#flip').setAttribute('transform',`scale(${sx.toFixed(4)},${sc.toFixed(4)})`);
}
function setPose(p){
  if(p===true) p='side'; if(p===false) p='idle';
  S.pose = p; S.walking = p!=='idle';
  $('#character').style.display = (p==='idle'||p==='front') ? '' : 'none';
  $('#characterSide').style.display = p==='side' ? '' : 'none';
  $('#characterBack').style.display = p==='back' ? '' : 'none';
  resetJoints();
  if(p==='idle'){ phase = 0; $('#bob').removeAttribute('transform'); }
  setPlayer();
}
const rot = (sel,deg,cx,cy) => $(sel).setAttribute('transform',`rotate(${deg.toFixed(2)} ${cx} ${cy})`);
const lift = (sel,dy) => $(sel).setAttribute('transform',`translate(0 ${dy.toFixed(2)})`);
/* Laufstil je Figur: Standardwerte = Gang der Alchemistin; eine Seite kann window.WALK_STYLE vorher setzen. */
const WALK = Object.assign({hip:20, knee:44, arm:16, fore:16, lean:3, swag:0, lift:13, bob:6, sway:1.6, armOut:4, speed:330}, window.WALK_STYLE || {});
const LEG_T = 198, LEG_S = 223, LEG = LEG_T + LEG_S, HIP_A = WALK.hip;   // Ober-/Unterschenkel (lokale Einheiten), Hüftausschlag
const STRIDE_PER_RAD = 2*LEG*Math.sin(HIP_A*Math.PI/180)/Math.PI;    // Weg pro Phasen-Radiant -> Füße rutschen nicht
function animateSide(ph){
  /* Seitlicher Gang: Hüfte schwingt, das Schwungbein beugt das Knie früh nach dem Abdrücken.
     Die Körperhöhe wird aus der Beinstellung berechnet, so dass das Standbein immer den Boden berührt. */
  let ground = Infinity;
  [['#side_leg_near', ph], ['#side_leg_far', ph + Math.PI]].forEach(([sel,p])=>{
    const hip = -HIP_A*Math.sin(p);
    const swing = Math.max(0, Math.cos(p + 0.6));
    const knee = 4 + WALK.knee*Math.pow(swing, 1.4);
    rot(sel, hip, 205, 352); rot(sel+'_shin', knee, 206, 550);
    const h = hip*Math.PI/180, k = (hip + knee)*Math.PI/180;
    ground = Math.min(ground, LEG - (LEG_T*Math.cos(h) + LEG_S*Math.cos(k)));   // wie weit der Fuß über dem Boden schwebt
  });
  [['#side_arm_near', ph + Math.PI], ['#side_arm_far', ph]].forEach(([sel,p])=>{
    rot(sel, -WALK.arm*Math.sin(p), 205, 232); rot(sel+'_fore', -12 - WALK.fore*Math.max(0, Math.sin(p)), 204, 288);
  });
  const lean = WALK.lean + WALK.swag*Math.sin(2*ph);
  $('#bob').setAttribute('transform', `translate(0 ${ground.toFixed(2)}) rotate(${lean.toFixed(2)} 205 770)`);
}
function animateStraight(ph, legs, arms){
  /* Laufen auf die Kamera zu oder weg: Beine heben sich weich abwechselnd,
     der Körper ist am höchsten, wenn ein Bein durchschwingt, und pendelt leicht. */
  const a = Math.sin(ph), sl = Math.max(0, a), sr = Math.max(0, -a);
  const hl = -WALK.lift*sl*sl*(3-2*sl), hr = -WALK.lift*sr*sr*(3-2*sr);
  legs[0].forEach(sel => lift(sel, hl)); legs[1].forEach(sel => lift(sel, hr));
  if(arms){
    // Von hinten schwingen die Arme vor/zurück: leichte Verkürzung, Pendeln nur nach außen, nie über den Körper.
    const sw = (sel, out, cx, k) => $(sel).setAttribute('transform',
      `rotate(${out.toFixed(2)} ${cx} 230) translate(${cx} 230) scale(1 ${k.toFixed(3)}) translate(${-cx} -230)`);
    sw(arms[0],  WALK.armOut*sl, 168, 1 - 0.09*sr);
    sw(arms[1], -WALK.armOut*sr, 232, 1 - 0.09*sl);
  }
  const bob = -Math.abs(a)*WALK.bob, sway = WALK.sway*a;
  $('#bob').setAttribute('transform', `translate(0 ${bob.toFixed(2)}) rotate(${sway.toFixed(2)} 200 770)`);
}
function animateWalk(ph){
  if(S.pose==='side') animateSide(ph);
  else if(S.pose==='front') animateStraight(ph, [['#front_leg_l','#boot_l'],['#front_leg_r','#boot_r']]);
  else if(S.pose==='back') animateStraight(ph, [['#back_leg_l'],['#back_leg_r']], ['#back_arm_l','#back_arm_r']);   // Stiefel + Absatz stecken in der Beingruppe
}
function animateJoints(ph){ animateSide(ph); }   // Kompatibilität (Tests)
function resetJoints(){
  ['#side_leg_near','#side_leg_far','#side_arm_near','#side_arm_far','#side_leg_near_shin','#side_leg_far_shin',
   '#side_arm_near_fore','#side_arm_far_fore','#front_leg_l','#front_leg_r','#boot_l','#boot_r',
   '#back_leg_l','#back_leg_r','#back_boot_l','#back_boot_r','#back_arm_l','#back_arm_r']
    .forEach(s=>{ const el=$(s); if(el) el.removeAttribute('transform'); });
}
function face(){ /* Frontansicht bleibt im Stand immer ungespiegelt */ }
function choosePose(dx, dy){
  const p = Math.abs(dy)*DEPTH > Math.abs(dx) ? (dy < 0 ? 'back' : 'front') : 'side';
  if(Math.abs(dx) > 0.5) S.dir = dx > 0 ? 1 : -1;
  if(p !== S.pose) setPose(p); else setPlayer();
}
function walkTo(x, cb, y){
  target = {x: clamp(x, 60, 1220), y: (y===undefined || y===null) ? S.y : clamp(y, FLOOR_MIN, FLOOR_MAX)};
  walkCb = cb || null;
  const dx = target.x - S.x, dy = target.y - S.y;
  if(Math.hypot(dx, dy*DEPTH) < 3){ target=null; setPose('idle'); const c=walkCb; walkCb=null; c&&c(); return; }
  choosePose(dx, dy);
  if(!running){ running = true; last = 0; requestAnimationFrame(step); }
}
function step(ts){
  if(!target){ running=false; return; }
  const dt = last ? Math.min(.05,(ts-last)/1000) : 0; last = ts;
  const dx = target.x - S.x, dy = target.y - S.y;
  const dist = Math.hypot(dx, dy*DEPTH), mv = WALK.speed*dt;
  if(dist <= mv){
    S.x = target.x; S.y = target.y; target = null; running = false; setPose('idle');
    const c = walkCb; walkCb = null; c && c(); return;
  }
  S.x += dx/dist*mv; S.y += dy/dist*mv;
  phase += mv/(STRIDE_PER_RAD*depthScale(S.y));
  animateWalk(phase); setPlayer(); requestAnimationFrame(step);
}


svg.addEventListener('click', e => { tour = null; const p = svgPoint(e); walkTo(p.x, null, p.y >= 600 ? p.y : null); });
let tour = null;
const ROUTE = [[1000,690],[1000,648],[300,648],[300,702],[640,690]];
function runTour(i=0){ if(tour===null) return; if(i>=ROUTE.length){ tour=null; return; } walkTo(ROUTE[i][0], ()=>setTimeout(()=>runTour(i+1),350), ROUTE[i][1]); }
$('#btnTour').onclick = () => { tour = 1; runTour(0); };
$('#btnStyle').onclick = () => {
  const c = document.body.classList.toggle('color'); document.body.classList.toggle('dark', !c); document.body.classList.toggle('nolines', !c);
  $('#btnStyle').textContent = c ? 'Scherenschnitt ansehen' : 'Farbversion ansehen';
};
setPose('idle');
setTimeout(()=>{ tour = 1; runTour(0); }, 600);
</script></body></html>
